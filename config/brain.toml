# Memory brain v0 (brain/brain.py): a skeleton beside the existing L1/L2/L3 memory. It reads L2 only and keeps its
# own SQLite store. Off until we have seen it run (Laris + GOAT, 2026-11-15).
[brain]
enabled = true
# empty = $XDG_STATE_HOME/goat2/brain.sqlite, else ~/.local/state/goat2/brain.sqlite (persistent disk, like the logs)
db_path = ""
interval_seconds = 60       # one sleep cycle per minute
max_events_per_cycle = 200  # small slices: a cycle never processes more than this ...
max_cycle_ms = 200          # ... or runs longer than this; the rest waits for the next cycle
nucleus_items = 10          # open items kept per chat and lane
record_slow_ms = 2000       # the request hook writes the whole turn, never cancelled; slower than this is logged
inject = true               # the nucleus goes into GOAT's system prompt as one short block (false = prompt as before)
inject_max_chars = 600      # the whole block, header included, at most this many characters
inject_promise_max_hours = 24  # a promise older than this is no longer shown in the block (kept in the store; T33)
scheduler = true            # scheduled messages (brain/scheduler.py) go out on this same tick, through notify()
scheduler_max_attempts = 3  # a message that fails this many sends is marked failed (kept in the table)
graph = true                # memory graph phase F1 (brain/graph.py): built from L3 on this tick; nothing reads it yet
graph_ingest_per_tick = 100 # L3 memories per tick (the first ~40 ticks backfill the 3.8k existing ones; keeps the brain lock short)
graph_recall = true         # §12: the living graph — activation brings associated memories into the prompt and every
                            # turn forms/strengthens links (brain/live.py); false = the prompt as without the graph
graph_recall_k = 3          # recalled memories per turn, at most
graph_hub_fraction = 0.15   # a thing in more than this share of episodes forms no thing<->thing pairs
graph_half_life_days = 14   # an untouched link halves every 14 days, down to the 0.001 floor (never deleted)
graph_pairs_per_tick = 200  # episodes per tick for thing<->thing pairs (covers the history in slices)
graph_fade_per_tick = 500   # link weights brought up to date per tick (UPDATE only)

[mind]
# working memory "În minte" (brain/mind.py): one shared state per chat and lane; off until it has been seen working
enabled = false
carry = 0.6           # activation kept from one turn to the next
floor = 0.001         # an item fades to this and stays (never deleted)
expose_items = 12     # items shown to GOAT per turn, at most
encode_per_tick = 20  # episodes encoded per sleep tick
