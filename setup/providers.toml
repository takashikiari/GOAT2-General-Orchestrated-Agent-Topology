# GOAT 2.0 — Supported LLM Providers
# This file is the source of truth for the setup wizard.
#
# Only the providers GOAT can actually run (config/settings.py Provider: openai | deepseek | groq). For each one:
#   env_key        the variable GOAT reads the key from: GOAT_{PROVIDER}_API_KEY
#   base_url       written to .env as BASE_URL for the default provider; GOAT picks the provider from it
#   fast_model     written to .env as MODEL_NAME for the default provider: GOAT itself and the fast roles
#                  (researcher, critic, summarizer, tool_caller, memory)
#   strong_model   written as GOAT_AGENT_PLANNER_MODEL and GOAT_AGENT_CODER_MODEL (the roles that plan and write code)
# tests/test_setup_env_contract.py checks these against config/settings.py.

[[providers]]
id            = "deepseek"
name          = "DeepSeek"
models        = ["deepseek-v4-flash", "deepseek-chat", "deepseek-reasoner"]
fast_model    = "deepseek-v4-flash"
strong_model  = "deepseek-v4-flash"   # no stronger DeepSeek model confirmed yet: same as today
env_key       = "GOAT_DEEPSEEK_API_KEY"
base_url      = "https://api.deepseek.com"
docs_url      = "https://platform.deepseek.com"
notes         = "Best price/quality ratio. Recommended default."
recommended   = true

[[providers]]
id            = "openai"
name          = "OpenAI"
models        = ["gpt-4o-mini", "gpt-4o"]
fast_model    = "gpt-4o-mini"
strong_model  = "gpt-4o"
env_key       = "GOAT_OPENAI_API_KEY"
base_url      = "https://api.openai.com/v1"
docs_url      = "https://platform.openai.com/api-keys"
notes         = "Industry standard. Get key at platform.openai.com"
recommended   = false

[[providers]]
id            = "groq"
name          = "Groq"
models        = ["llama-3.3-70b-versatile"]
fast_model    = "llama-3.3-70b-versatile"
strong_model  = "llama-3.3-70b-versatile"   # the only model listed
env_key       = "GOAT_GROQ_API_KEY"
base_url      = "https://api.groq.com/openai/v1"
docs_url      = "https://console.groq.com"
notes         = "Very fast inference. Free tier available."
recommended   = false
