# GOAT 2.0 — Services
# required = true: GOAT needs it and the pre-flight checks stop until it is there (Redis, ChromaDB, Telegram).
# required = false: optional, offered in the wizard (Letta only).
# Redis and Letta addresses are read from config/memory.toml ([working] storage_url, [permanent] letta_url).

[[services]]
id          = "redis"
name        = "Redis"
recommended = true
required    = true
description = "Session memory (L2), activation state, DAG state. GOAT does not answer without it."
default_url = "redis://localhost:6379/0"
install_url = "https://redis.io/docs/getting-started/"
notes       = "Install: brew install redis (Mac) / apt install redis (Linux)"

[[services]]
id          = "chroma"
name        = "ChromaDB"
recommended = true
required    = true
description = "Long-term memory (L3), embedded: no server, installed with requirements.txt."
persist_dir = "./chroma_data"
install_url = "https://docs.trychroma.com/getting-started"
notes       = "Installed automatically with pip install -r requirements.txt"

[[services]]
id          = "letta"
name        = "Letta"
recommended = false
required    = false
description = "Permanent facts and identity (L1). Optional: without it L1 is empty and GOAT still answers."
default_url = "http://localhost:8283"
install_url = "https://docs.letta.com"
notes       = "Requires Letta server running separately."

[[services]]
id          = "telegram"
name        = "Telegram Bot"
recommended = true
required    = true
description = "Primary communication interface. Required to run GOAT."
env_key     = "TELEGRAM_BOT_TOKEN"
docs_url    = "https://t.me/BotFather"
notes       = "Create a bot via @BotFather on Telegram. Takes ~1 minute."
